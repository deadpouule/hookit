name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      INK_RPC_URL: ${{ secrets.INK_RPC_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build

      # Fork suites hit a live RPC; the public Ink endpoint rate-limits GitHub runners (HTTP 429),
      # so they only run when a dedicated INK_RPC_URL secret is configured.
      - name: Run Forge tests (local)
        run: forge test -vvv --no-match-path "test/Fork*.t.sol"

      - name: Run Forge fork tests
        if: ${{ env.INK_RPC_URL != '' }}
        run: forge test -vvv --match-path "test/Fork*.t.sol"
