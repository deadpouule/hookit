# /etc/nginx/sites-available/hookit.conf
# Replace YOUR_DOMAIN, then: sudo ln -sf .../hookit.conf /etc/nginx/sites-enabled/

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream hookit_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    # Custom Solidity compile/deploy can take ~2 min
    proxy_read_timeout 200s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 200s;

    location / {
        proxy_pass http://hookit_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Optional: expose indexer health publicly (charts go through Next /api/indexer)
    # location /indexer/ {
    #     rewrite ^/indexer/(.*)$ /$1 break;
    #     proxy_pass http://127.0.0.1:8787;
    # }
}
