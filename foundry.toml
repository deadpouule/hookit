[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 44444444
via_ir = true
ffi = true
bytecode_hash = "none"
fs_permissions = [
    { access = "read-write", path = "./.forge-snapshots" },
    { access = "read-write", path = "./.gas-snapshot" },
]
gas_reports = ["MasterLaunchHook", "LaunchFactory", "FloorVault", "FeeEscrow", "ProtocolRevenueDistributor"]
ignored_error_codes = [2394, 3860]

[profile.default.fuzz]
runs = 256

[profile.intense]
optimizer = true
via_ir = true

[profile.intense.fuzz]
runs = 10000

[profile.intense.invariant]
runs = 256
depth = 32

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"
ink = "${INK_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api", chain = 84532 }
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api", chain = 8453 }
ink = { key = "${INK_EXPLORER_API_KEY}", url = "https://explorer.inkonchain.com/api", chain = 57073 }

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const", "unsafe-typecast", "erc20-unchecked-transfer"]
lint_on_build = false
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
